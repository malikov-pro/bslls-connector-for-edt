# Анализ SonarCloud (шаг «Анализ SonarCloud» в ci.yml)
sonar.projectKey=malikov-pro_bslls-connector-for-edt
sonar.organization=malikov-pro

# исходники бандла (Tycho-раскладка src/), классы появляются после mvn verify
# (sonar.sources не допускает wildcards — пути прямые)
sonar.sources=connector/bundles/com.github.malikov-pro.dt.bsl.lspconnector/src
sonar.java.binaries=connector/bundles/com.github.malikov-pro.dt.bsl.lspconnector/target/classes

# юнит-тестов пока нет — не считать отсутствие покрытия ошибкой конфигурации
sonar.coverage.exclusions=**/*

# сканер не должен поднимать C/ObjC-детекторы
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
