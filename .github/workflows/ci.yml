name: Непрерывная интеграция

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Актуализация
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Установка JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: x64
          # реджестри пакетов 1С
          server-id: dt_repository
          # назначается в сборке
          server-username: MAVEN_USERNAME
          # назначается в сборке
          server-password: MAVEN_CENTRAL_TOKEN # в открытом виде в секретах

      # https://docs.github.com/en/free-pro-team@latest/actions/guides/building-and-testing-java-with-maven
      - name: Кеширование m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}-${{ hashFiles('targets/default/default.target') }}
          restore-keys: ${{ runner.os }}-m2

      # каталог check.descriptions генерируется локально и не хранится в git (.gitignore)
      # скрипт требует сабмодуля third_party/v8std, он чекаутится шагом выше
      - name: Генерация каталога диагностик
        run: python3 scripts/generate-ls-checks.py --offline

      # https://edt.1c.ru/dev/ru/docs/plugins/project/build-install-publish-project/
      # XML-entity лимиты приходят из connector/.mvn/jvm.config
      - name: Сборка
        working-directory: connector
        run: mvn verify -Dtycho.localArtifacts=ignore
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}

      # конфиг сканера — sonar-project.properties; на форк-PR секретов нет — шаг пропустится
      - name: Анализ SonarCloud
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
